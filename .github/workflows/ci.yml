# CI — lint + type-check on every PR. Deployed on Vercel (own build).
# Single Next app on npm (no turbo). Heavy checks (build) run in the pre-push
# hook locally, so red-CI iteration is avoided — this job is the cheap gate.
# See .claude/rules/conventions/ci-cost.md (Business repo) for the standard.
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".vscode/**", "LICENSE"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install (clean)
        run: npm ci

      # La définition a quitté ce fichier pour le `Makefile` : un agent qui arrive sur ce
      # dépôt lance `make check` sans lire un workflow. Les pas restent SÉPARÉS — un
      # `make check` monolithique dirait « rouge » sans dire lequel des trois.
      #
      # ⚠️ `make lint` porte MAINTENANT `format:check` en plus d'eslint. Prettier était
      # déclaré dans `package.json` et ne tournait dans AUCUNE porte — ni ici, ni au
      # `pre-push` (qui ne fait qu'un `npm run build`). Une capacité sans appelant n'est
      # pas testée.
      #
      # ⚠️ Le `name:` du job ci-dessus n'est PAS renommé : il EST le contexte du check
      # requis côté ruleset. Le script `type-check` de `package.json`, lui, est devenu
      # `typecheck`.
      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck
